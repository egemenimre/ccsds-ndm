# Python CircleCI 2.1 configuration file
version: 2.1

jobs:

  test:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Install tox
          command: pip install tox
      - run:
          name: Run tests
          command: |
            PY_ENV=$(echo "<< parameters.python-version >>" | tr -d '.')
            tox -e py${PY_ENV} -- --junitxml=test-results/results.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results

  codestyle:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Install tox
          command: pip install tox
      - run:
          name: Run codestyle checks
          command: tox -e codestyle

  coverage:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Install tox
          command: pip install tox
      - run:
          name: Run coverage
          command: tox -e coverage
      - store_artifacts:
          path: coverage.xml

workflows:
  ci:
    jobs:
      - test:
          matrix:
            parameters:
              python-version: ["3.11", "3.12", "3.13", "3.14"]
      - codestyle
      - coverage
