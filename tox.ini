# This is the setup file for the tox tool
[tox]
description = tox environments list
envlist =
    py311
    py312
    py313    
    py314
    quicktest
    clean_coverage
    coverage
    build_docs
    linkcheck
    reformat
    codestyle

# skips packaging
skipsdist = True

isolated_build = true

[testenv]
description = run tests

whitelist_externals =
    /bin/bash
    /usr/bin/bash
    sphinx-build

deps =
    pytest
    pytest-xdist
    -rrequirements.txt

commands =
    pytest {posargs:-vv --durations=0 --junitxml=test-results/test_output.xml}


[testenv:quicktest]
description = quick testing
deps =
    pytest
    pytest-xdist
commands =
    pytest {posargs:-v -n=auto}


[coverage:report]
omit =
    ci-helpers/*
    */tests/*
    */plots/*
    */temp/*
    *__init__.py
exclude_lines =
    def __repr__
    def __str__
    pragma: no cover

[testenv:benchmark]
description = run benchmark tests and save results to a file
deps =
    pytest
    -rrequirements.txt
skip_install = true
commands =
    pytest -v -s tests/test_benchmark.py --tb=short {posargs}

[testenv:coverage]
description = checks coverage
deps =
    pytest
    coverage
    -rrequirements.txt
skip_install = true
commands =
    coverage run --source ccsds_ndm -m pytest
    coverage xml
    coverage report -m

[testenv:reformat]
description = reformats the code using black and isort
deps =
    black
    isort
skip_install = true
commands =
    isort --project ccsds_ndm --section-default THIRDPARTY ccsds_ndm
    black ccsds_ndm tests docs

[testenv:codestyle]
description = this environments checks for flake8, black, isort code style
deps =
    black
    docutils
    isort
    flake8
    mypy
    pygments
skip_install = true
commands =
    flake8 ccsds_ndm tests docs --count
    isort --check-only --diff --project ccsds_ndm --section-default THIRDPARTY ccsds_ndm tests docs
    black --check ccsds_ndm tests docs
    mypy --ignore-missing-imports --check-untyped-defs --no-strict-optional ccsds_ndm


[testenv:build_docs]
changedir = docs
description = invoke sphinx-build to build the HTML docs
allowlist_externals = sphinx-build
setenv =
    READTHEDOCS_PROJECT = ccsds-ndm
    READTHEDOCS_VERSION = latest
deps = -r{toxinidir}/doc_requirements.txt
extras = docs
commands =
    pip freeze
    sphinx-build -W --color -b html . _build/html

[testenv:linkcheck]
changedir = docs
description = check the links in the HTML docs
deps = -r{toxinidir}/doc_requirements.txt
extras = docs
commands =
    pip freeze
    sphinx-build -W -b linkcheck . _build/html



# --------------- Tool config ---------------

[pytest]
norecursedirs = .git .tox dist env _build venv docs
addopts = -s


[flake8]
ignore = E203, E266, W503, E501
exclude =
    # No need to traverse our git directory
    .git,
    # There's no value in checking cache directories
    __pycache__,
    # The conf file is mostly autogenerated, ignore it
    docs/source/conf.py,
    # The old directory contains Flake8 2.0
    old,
    # This contains our built documentation
    build,
    # This contains builds of flake8 that we don't want to check
    dist,
    # This contains some temp files
    temp
max-line-length = 88
max-complexity = 18
select = B,C,E,F,W,T4,B9

[isort]
profile = black
multi_line_output=3
include_trailing_comma=True
force_grid_wrap=0
use_parentheses=True
line_length=88